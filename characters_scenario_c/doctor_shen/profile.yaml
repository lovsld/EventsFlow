# V0.2-C C2 (design decision 5's sibling, section 3.5): a
# disclosure duty declared as DATA — the night-shift doctor who
# privately knows a fever patient is coming is obliged to inform
# the nurse. This is the contract's intended use, not a scenario
# special case: the mechanism is generic, the clinic merely
# exercises it. `when` is a subjective condition over the doctor's
# own belief (already 1.0 at start); targets name the nurse.
