# V0.2-C 定向修复轮（与 C2 给医生加 duty 同例）：一条以数据
# 声明的披露职责——管药柜的夜班护士补齐退烧药后，必须向值
# 班医生回报。契约的正当数据使用：机制全通用（在场则生成
# disclose 候选，不在场则职责驱动寻求移动），诊所只是行使
# 它。此前护士无此职责，回流只能靠医生来问或偶遇，是数据
